name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production deploys use the protected "production" environment.
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: dunbarscircles.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: dunbarscircles
          VITE_FIREBASE_STORAGE_BUCKET: dunbarscircles.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Analytics measurement ID is only injected for production builds.
          VITE_FIREBASE_MEASUREMENT_ID: ${{ github.event_name == 'push' && secrets.VITE_FIREBASE_MEASUREMENT_ID || '' }}

      - name: Warn when deploy credentials are missing
        if: env.HAS_FIREBASE_TOKEN != 'true'
        run: echo "::warning::Secret FIREBASE_TOKEN is not set; build verified but nothing was deployed. See docs/ops/ENVIRONMENT.md."

      # Pushes to main go live. Same-repo pull requests get a 7-day preview channel.
      # Uses only the Firebase CLI and a Firebase CI token (no Google Cloud service account).
      - name: Deploy to production (Firebase CLI)
        if: env.HAS_FIREBASE_TOKEN == 'true' && github.event_name == 'push'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project dunbarscircles --non-interactive

      - name: Deploy preview channel (Firebase CLI)
        if: env.HAS_FIREBASE_TOKEN == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(npx --yes firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.number }}" --expires 7d --project dunbarscircles --non-interactive --json)
          url=$(echo "$out" | jq -r '.result | to_entries[0].value.url')
          echo "Preview: $url"
          gh pr comment "${{ github.event.number }}" --body "Preview (expires in 7 days, not indexed): $url"

  smoke:
    name: production smoke test
    needs: build_and_deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke-test.sh https://dunbarscircles.web.app
